name: bapendacore
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ==========================================
  # 🧠 ARCHITECTURE & STATE MANAGEMENT
  # ==========================================
  flutter_bloc: ^8.1.4
  get_it: ^7.7.0
  injectable: ^2.4.1
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1

  # ==========================================
  # 📸 NATIVE CAMERA UTILS
  # ==========================================
  camera: ^0.11.0+1
  
  # ==========================================
  # 🚦 ROUTING & NAVIGATION
  # ==========================================
  go_router: ^14.3.0

  # ==========================================
  # 🌐 NETWORK & API
  # ==========================================
  dio: ^5.4.3
  http_parser: ^4.0.2
  connectivity_plus: ^7.1.1 
  dio_smart_retry: ^7.0.1


  # ==========================================
  # 💾 DATA STORAGE & FILE MANAGEMENT
  # ==========================================
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2 
  flutter_image_compress: ^2.3.0

  # ==========================================
  # 🛠️ UTILS & HELPERS
  # ==========================================
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  flutter_dotenv: ^6.0.0
  file_picker: ^11.0.2
  intl: ^0.20.2
  open_filex: ^4.7.0
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  gal: ^2.3.2
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  app_settings: ^5.1.1


  # ==========================================
  # 📡 LOGGING & DIAGNOSTICS
  # ==========================================
  logger: ^2.7.0
  chucker_flutter: ^1.9.1

  # ==========================================
  # 🗺️ MAPS & LOCATION
  # ==========================================
  google_maps_flutter: ^2.5.3
  geocoding: ^3.0.0
  geolocator: ^11.0.1
  flutter_typeahead: ^6.0.0

  # ==========================================
  # 🎨 UI COMPONENTS, ICONS & ANIMATION
  # ==========================================
  cupertino_icons: ^1.0.8
  google_fonts: ^7.0.2
  lottie: ^3.1.0
  fl_chart: ^0.69.0
  carousel_slider: ^5.1.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.5
  scrollable_positioned_list: ^0.3.8
  image: ^4.8.0
  skeletonizer: ^2.1.3
  flutter_pdfview: ^1.4.4
  infinite_scroll_pagination: ^5.1.1

  # --- CRYPTOGRAPHY & SECURITY ---
  crypto: ^3.0.3 # Engine matematis untuk HMAC-SHA256
  convert: ^3.1.1 # Untuk manipulasi byte/base64
  envied: ^0.5.4 # Manager rahasia dengan fitur XOR Obfuscation
  package_info_plus: ^8.0.0 # Untuk membaca metadata & identitas aplikasi saat runtime
  flutter_svg: ^2.3.0
  dotted_border: ^2.1.0
  url_launcher: ^6.3.2
  pdf: 3.12.0
  printing: ^5.12.0
  collection: ^1.19.1
  signalr_netcore: ^1.4.4
  path: ^1.9.1
  cached_network_image: ^3.4.1
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ==========================================
  # ⚙️ CODE GENERATORS
  # ==========================================
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  envied_generator: ^0.5.4

  # ==========================================
  # 🔧 TOOLING & SCRIPTS
  # ==========================================
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.3
  # top_snackbar_flutter: ^3.3.0

flutter:
  uses-material-design: true

  # ==========================================
  # 📁 ASSETS MANAGEMENT
  # ==========================================
  assets:
    - .env
    - assets/images/

# ==========================================
# 📱 APP ICON CONFIGURATION
# ==========================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-surabayatax.png"
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/icons/iconApp.png"
